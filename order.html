<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order #4821 — Iskaparate.ph</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-page="order">
<div id="site-header"></div>
<main class="container stack" style="padding-top:32px;padding-bottom:64px;--g:24px" id="root"></main>
<div id="site-footer"></div>

<script src="assets/js/site.js"></script>
<script>
(function () {
  const { fmt, esc, store, toast } = ISK;
  const sample = {
    id: '4821', total: 1490, method: 'GCash', day: 'Mon 9 Dec', time: '10:02 am',
    groups: [
      { shopId: 'rosa', name: 'Kusina ni Aling Rosa', short: 'Aling Rosa', area: 'Cubao, Quezon City', how: 'seller', date: 'Sat 14 Dec, afternoon', subtotal: 560, shipping: 100, lines: [{ name: 'Ube halaya, 500 g', qty: 2, total: 560 }] },
      { shopId: 'habi', name: 'Habi Iloilo Weaves', area: 'Iloilo City', how: 'courier', subtotal: 650, shipping: 180, lines: [{ name: 'Banig placemats, set of 4', qty: 1, total: 650 }] }
    ]
  };
  const order = store.get('isk-last-order', null) || sample;
  const received = store.get('isk-received', {});
  const seller = (g) => g.short || g.name;

  function timeline(steps, current) {
    return `<ol class="timeline">${steps.map((s, i) => `<li><div class="tl-rail"><span class="tl-dot ${i < current ? 'done' : i === current ? 'now' : 'later'}"></span>${i < steps.length - 1 ? '<span class="tl-line"></span>' : ''}</div><div class="tl-body"><span class="bold" style="font-size:15px">${esc(s[0])}</span><span class="small muted">${esc(s[1])}</span></div></li>`).join('')}</ol>`;
  }

  function render() {
    root.innerHTML = `<div class="stack" style="--g:8px"><h1 class="h1">Order #${esc(order.id)}</h1><p class="muted">Paid ${fmt(order.total)} with ${esc(order.method)} on ${esc(order.day)} · ${order.groups.length} shop${order.groups.length === 1 ? '' : 's'}</p></div>` +
      order.groups.map((g) => {
        const bySeller = g.how === 'seller';
        const when = g.date || 'Expected in 3 to 5 days';
        const got = !!received[g.shopId];
        const steps = [
          ['Request sent', order.day + ', ' + order.time],
          ['Confirmed by ' + seller(g), order.day],
          ['Paid with ' + order.method, order.day],
          ['Being prepared', 'Before ' + when],
          [bySeller ? 'Out for delivery with ' + seller(g) : 'With the courier', when],
          ['Delivered', 'Tap “I received it”'],
          ['Return window', '3 days after delivery'],
          ['Seller paid', 'After the return window']
        ];
        const current = got ? 6 : 4;
        const status = got ? 'In return window' : steps[current][0];
        const items = g.lines.map((l) => `${esc(l.name)} × ${l.qty}`).join(', ');
        const money = fmt(g.subtotal) + (g.shipping ? ' + ' + fmt(g.shipping) + ' delivery' : '');
        const side = `
          <div class="stack" style="--g:14px">
            <div class="card stack" style="--g:6px;padding:18px">
              <span class="bold">${bySeller ? 'Delivered by ' + esc(seller(g)) : 'Courier delivery'}</span>
              <span class="small muted">${bySeller ? esc(seller(g)) + ' will text you when the order is on the way.' : '[COURIER] · waybill [WAYBILL NUMBER]'}</span>
              <span class="small muted">${esc(when)}</span>
            </div>
            <div class="row" style="--g:8px">
              ${got ? '<span class="pill pill-green">Received · return window open</span>' : `<button type="button" class="btn btn-primary btn-sm" data-got="${g.shopId}">I received it</button>`}
              <button type="button" class="btn btn-link" style="background:none" data-report="1">Report a problem</button>
            </div>
            <div class="note note-grey small" style="line-height:1.55"><strong>Your ${fmt(g.subtotal)} is protected.</strong> If something is wrong, report it within 3 days of delivery and the payment stays on hold until Iskaparate Support decides.</div>
          </div>`;
        return `<section class="panel" style="border-radius:20px" aria-label="${esc(g.name)} order">
          <div class="panel-head" style="padding:18px 22px"><div class="stack" style="--g:2px"><span class="bold" style="font-size:18px">${esc(g.name)}</span><span class="small muted">${items} · ${money}</span></div><span class="pill ${got ? 'pill-green' : 'pill-gold'}" style="font-size:14px;font-weight:700;padding:8px 14px">${esc(status)}</span></div>
          <div class="grid" style="--min:360px;--g:32px;padding:22px">${timeline(steps, current)}${side}</div>
        </section>`;
      }).join('') +
      (store.get('isk-last-order', null) ? '' : '<p class="xs muted">This is a sample order. Place an order from your cart to see your own here.</p>');
  }
  const root = document.getElementById('root');
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.got) { received[b.dataset.got] = true; store.set('isk-received', received); toast('Thanks! The 3-day return window has started.'); render(); }
    if (b.dataset.report) toast('Support will contact you. Your payment stays on hold until then.');
  });
  render();
})();
</script>
</body>
</html>
